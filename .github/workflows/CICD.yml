name: Validate pinned i686 GNU runner

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          repository: PerchAnton/bat
          ref: 3e2c1bdc8e026b53a6ec91c3681dba73db5408b8
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: i686-unknown-linux-gnu
      - uses: actions/download-artifact@v4
        with:
          name: pinned-cross
          path: ${{ runner.temp }}/cross/bin
          repository: PerchAnton/bat
          run-id: 40682045338
          github-token: ${{ github.token }}
      - name: Record the exact source and production image
        shell: bash
        run: |
          chmod +x "$RUNNER_TEMP/cross/bin/cross"
          echo "$RUNNER_TEMP/cross/bin" >> "$GITHUB_PATH"
          test "$(git rev-parse HEAD)" = 3e2c1bdc8e026b53a6ec91c3681dba73db5408b8
          git show --stat --oneline HEAD
          cat /etc/os-release
          rustc -vV
          "$RUNNER_TEMP/cross/bin/cross" --version
          docker pull ghcr.io/cross-rs/i686-unknown-linux-gnu:main
          docker image inspect ghcr.io/cross-rs/i686-unknown-linux-gnu:main --format '{{json .RepoDigests}}'
      - name: Original release build command
        run: cross build --locked --release --target=i686-unknown-linux-gnu
      - name: Original unfiltered test command
        run: cross test --locked --target=i686-unknown-linux-gnu
      - name: Verify unchanged source and report release binary
        run: |
          git diff --exit-code HEAD
          sha256sum target/i686-unknown-linux-gnu/release/bat
